<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c6863" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1413" media="(prefers-color-scheme: dark)">
<meta name="description" content="Gastos do cartão da família: lançamentos por titular, categoria e parcelamento.">
<title>Gastos do Cartão</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<!--APP-->
<div class="demo" id="demoBar" hidden>Prévia com os dados das faturas de ago, set e out/2026. As mudanças ficam só nesta tela e somem ao recarregar.</div>
<div id="app" hidden>
  <header class="topbar">
    <div class="topline">
      <h1 class="brand">Gastos do Cartão<small id="brandSub"></small></h1>
      <span class="sync" id="sync" data-s="busy" role="status" aria-live="polite"><span class="led"></span><span id="syncTxt">Carregando…</span></span>
      <button class="iconbtn" id="btnMenu" data-act="menu" aria-label="Menu"></button>
    </div>
    <div class="filters">
      <button class="pickbtn" id="btnFatura" data-act="pick-fatura" aria-label="Escolher fatura"></button>
      <div class="seg" id="segTit" role="group" aria-label="Titular"></div>
    </div>
  </header>
  <main id="view"></main>
  <div class="actionbar" id="actionbar" hidden></div>
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Seções"></nav>
</div>
<div class="screen" id="screen" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<!--/APP-->
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
